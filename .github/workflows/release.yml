name: Release

# Tag a version (e.g. `git tag 0.1.1 && git push origin 0.1.1`) to build the
# plugin, attach the three assets, and attach build provenance attestations
# so the community directory can verify the artifacts came from this workflow.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build

      - name: Check manifest version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "tag $TAG != manifest.json version $MANIFEST" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
